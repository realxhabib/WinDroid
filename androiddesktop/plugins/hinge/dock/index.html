<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinge Matcher</title>
<link rel="stylesheet" href="dock.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="grain"></div></div>

<main class="dock" id="dock">
  <header class="head">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#ff5c8a"/>
        </linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#mk)"/>
        <path d="M16 23.5s-6.5-3.9-6.5-8.6c0-2.2 1.6-3.9 3.6-3.9 1.3 0 2.3.7 2.9 1.7.6-1 1.6-1.7 2.9-1.7 2 0 3.6 1.7 3.6 3.9 0 4.7-6.5 8.6-6.5 8.6z" fill="#fff"/>
      </svg>
      <span class="name">Matcher</span>
      <span class="pill" id="status"><i></i><b>Watching</b></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="bubble" title="Hide the idea on Hinge"><span class="glyph">&#xE7B3;</span></button>
      <button class="icon-btn" id="pause" title="Pause reading the screen"><span class="glyph">&#xE769;</span></button>
      <button class="icon-btn" id="collapse" title="Tuck the panel away"><span class="glyph">&#xE76C;</span></button>
    </div>
  </header>

  <button class="tab" id="tab" title="Show the panel" hidden>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="url(#mk)"/>
      <path d="M16 23.5s-6.5-3.9-6.5-8.6c0-2.2 1.6-3.9 3.6-3.9 1.3 0 2.3.7 2.9 1.7.6-1 1.6-1.7 2.9-1.7 2 0 3.6 1.7 3.6 3.9 0 4.7-6.5 8.6-6.5 8.6z" fill="#fff"/></svg>
    <span class="tab-count" id="tab-count"></span>
  </button>

  <div class="scroll" id="scroll">
    <section class="idle" id="idle">
      <div class="idle-art" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2 id="idle-title">Open a profile or a chat</h2>
      <p id="idle-text">On Discover, ideas show up here and on the card they're for. In a chat, you get reply ideas.</p>
    </section>

    <section class="who" id="who" hidden>
      <div class="who-row">
        <h1 id="who-name"></h1>
        <span class="chip stage" id="who-stage" hidden></span>
      </div>
      <div class="chips" id="who-chips"></div>
      <p class="summary" id="who-summary"></p>
      <div class="cards" id="who-cards"></div>
    </section>

    <section class="pick" id="pick" hidden>
      <div class="pick-head"><span class="heart">&#x2665;</span><span id="pick-title">Like</span></div>
      <p class="pick-why" id="pick-why"></p>
    </section>

    <section class="skipnote" id="skipnote" hidden>
      <span class="glyph">&#xE7BA;</span><div><b id="skip-title">Claude would skip this one</b><p id="skip-why"></p></div>
    </section>

    <section class="needs" id="needs" hidden>
      <span class="glyph">&#xE897;</span><div><b>Needs your input</b><p id="needs-text"></p></div>
    </section>

    <section class="ideas-wrap" id="ideas-wrap" hidden>
      <div class="section-head"><h2 id="ideas-title">Openers</h2><span class="hint" id="ideas-hint">click to fill in</span></div>
      <ol class="ideas" id="ideas"></ol>
    </section>

    <section class="banner" id="banner" hidden></section>
  </div>

  <footer class="controls" id="controls">
    <div class="tone">
      <span class="tone-end" id="tone-left">Playful</span>
      <input type="range" id="warmth" min="-100" max="100" value="0" step="1" aria-label="Playful to sincere">
      <span class="tone-end" id="tone-right">Sincere</span>
    </div>
    <div class="row">
      <div class="seg" id="length" role="radiogroup" aria-label="Length">
        <button data-v="-1" title="Shorter ideas">Shorter</button><button data-v="0" class="on">Auto</button><button data-v="1" title="Longer ideas">Longer</button>
      </div>
      <button class="ghost danger" id="skip" title="Skip this profile (you tap the ✕ in Hinge)"><span class="glyph">&#xE711;</span>Skip</button>
    </div>
    <div class="direct">
      <input id="hint" placeholder="Tell Claude… e.g. mention I cook" maxlength="240" spellcheck="false">
      <button class="primary" id="regen" title="Write new ideas (R)"><span class="glyph">&#xE72C;</span><span>New ideas</span></button>
    </div>
    <div class="keys" id="keys"></div>
  </footer>
</main>

<div class="toast" id="toast" hidden></div>
<script src="dock.js"></script>
</body>
</html>
