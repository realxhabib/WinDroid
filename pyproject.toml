[project]
name = "androiddesktop"
dynamic = ["version"]
description = "WinDroid: Android apps as independent, frameless Windows windows, running in a headless Android VM."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pillow>=11",
    "pywin32>=308",
    "pywebview>=5.4",
]

[project.gui-scripts]
androiddesktop = "androiddesktop.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["androiddesktop"]

[tool.setuptools.dynamic]
version = {attr = "androiddesktop.__version__"}  # the one place it's set; a release's tag must match it

[tool.setuptools.package-data]
androiddesktop = ["assets/*", "ui/*"]
